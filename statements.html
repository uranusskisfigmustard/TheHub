<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Hub — Statements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player-shell.css?v=20260919-statementsprod1">
  <link rel="stylesheet" href="statements.css?v=20260919-statementsprod1">
</head>
<body data-page="statements">
  <div id="playerShell"></div>

  <main class="player-main statements-mode">
    <section id="statementsPage" class="statements-page" aria-labelledby="statementsTitle">
      <div class="statements-heading">
        <h1 id="statementsTitle">Statements</h1>
        <p class="statements-sub">Hub Claims Registry recovery-debt account statements.</p>
      </div>

      <div class="statement-controls" aria-label="Statement controls">
        <button class="statement-btn active" type="button" data-statement-character="prue" aria-pressed="true">PRUDENCE GREYMORE</button>
        <button class="statement-btn" type="button" data-statement-character="john" aria-pressed="false">JOHN SOBIESKI</button>
        <button class="statement-btn" type="button" data-statement-print>PRINT STATEMENT</button>
        <button class="statement-btn" type="button" data-statement-refresh>REFRESH</button>
      </div>

      <div class="statement-status">
        <span data-statement-status>Loading current statements…</span>
        <span data-statement-who></span>
      </div>

      <div data-statement-view></div>
    </section>
  </main>

  <noscript><div class="hub-shell-fatal">JavaScript is required for the player console.</div></noscript>

  <script src="player-routes.js?v=20260919-statementsprod1"></script>
  <script src="player-shell.js?v=20260919-statementsprod1"></script>
  <script src="statements.js?v=20260919-statementsprod1"></script>
  <script>
    (() => {
      const STATEMENTS_API = 'https://script.google.com/macros/s/AKfycbzeW8vTooOCNEBia3_EMQ10r7BcbakXIwCD4ZaEOUEBOdCXl09tRHj76oxcUcsOKQK0/exec';

      if (!window.HubStatementsContent || typeof window.HubStatementsContent.render !== 'function') {
        throw new Error('Statements content module failed to load.');
      }

      const root = document.getElementById('statementsPage');
      if (!root) throw new Error('Statements root is unavailable.');

      window.HubStatementsContent.render(root, {
        api: STATEMENTS_API,
        snapshotUrl: './data/player-statements.json',
        cacheKey: 'hub_statement_export_v3',
        legacyCacheKeys: ['hub_statement_export_v1', 'hub_statement_export_v2']
      });
    })();
  </script>
</body>
</html>

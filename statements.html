<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hub — Statements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#111315;--panel:#191c1f;--text:#e7e4dc;--muted:#aaa79f;--line:#3a3f43;--accent:#d4a84b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
header{position:sticky;top:0;z-index:5;background:rgba(17,19,21,.97);border-bottom:1px solid var(--line);padding:16px 18px 12px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.2rem,4vw,1.8rem);letter-spacing:.08em;text-transform:uppercase}.sub{color:var(--muted);font-size:.82rem;margin-top:3px}.controls{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.btn{font:inherit;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer;font-weight:800;letter-spacing:.08em;text-decoration:none}.btn:hover{border-color:var(--accent);color:var(--text)}.btn.active{color:var(--text);border-color:var(--accent);background:rgba(212,168,75,.10)}.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 18px;color:var(--muted);font-size:.78rem;border-bottom:1px solid #25292c}main{max-width:1180px;margin:0 auto;padding:18px}.sheet{width:min(100%,8.5in);min-height:11in;margin:0 auto;padding:.5in;background:#fff;color:#000;border:1px solid #c9c7bf;box-shadow:0 12px 36px rgba(0,0,0,.38);overflow:auto}.sheet pre{margin:0;min-width:max-content;white-space:pre;color:#000;font-family:"VT323","Courier New",monospace;font-size:16px;line-height:1;font-weight:400}.error{width:min(100%,8.5in);margin:0 auto;padding:24px;border:1px dashed #6d4e45;color:var(--muted);background:var(--panel)}
@media(max-width:760px){.sheet{padding:20px;min-height:auto}}
@page{size:letter;margin:0}@media print{body{background:#fff}header,.status{display:none!important}main{max-width:none;margin:0;padding:0}.sheet{width:8.5in;height:11in;min-height:11in;margin:0;padding:.5in;border:0;box-shadow:none;overflow:visible}.sheet pre{font-size:10pt;line-height:1}}
</style>
</head>
<body>
<header><div class="top"><div><h1>The Hub // Statements</h1><div class="sub">Hub Claims Registry recovery-debt account statements.</div></div><a class="btn" href="./">BACK TO BOARD</a></div><div class="controls"><button id="john" class="btn active">JOHN SOBIESKI</button><button id="prue" class="btn">PRUDENCE GREYMORE</button><button id="print" class="btn">PRINT STATEMENT</button><button id="refresh" class="btn">REFRESH</button></div></header>
<div class="status"><span id="status">Loading current statements…</span><span id="who"></span></div>
<main><div id="view"></div></main>
<script>
(()=>{
const SHEET_ID="1bg6UsBTaNanhCm9xwWbafEag6TpinCuGdlmkqv-c38c",GID="1938401122",CACHE="hub_statement_export_v1";
const view=document.getElementById("view"),status=document.getElementById("status"),who=document.getElementById("who"),john=document.getElementById("john"),prue=document.getElementById("prue");let rows={},selected="john";
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
function normalize(t){if(!t?.cols||!t?.rows)return{};const labels=t.cols.map((c,i)=>(c.label||String.fromCharCode(65+i)).trim()),out={};for(const r of t.rows){const o={};labels.forEach((l,i)=>o[l]=r.c?.[i]?.f??r.c?.[i]?.v??"");if(o.Key)out[String(o.Key).toLowerCase()]=o}return out}
function render(){const r=rows[selected];john.classList.toggle("active",selected==="john");prue.classList.toggle("active",selected==="prue");if(!r){view.innerHTML='<div class="error">Statement data unavailable.</div>';who.textContent="";return}status.textContent=`CURRENT STATEMENT // AS OF ${r["As Of"]||"—"}`;who.textContent=r.Character||"";view.innerHTML=`<article class="sheet"><pre>${esc(r["Statement Text"]||"")}</pre></article>`}
function use(data,source){rows=data;try{localStorage.setItem(CACHE,JSON.stringify(data))}catch(_){};status.textContent=source;render()}
window.__hubStatements=function(resp){try{if(!resp||resp.status==="error")throw Error(resp?.errors?.[0]?.message||"Statement export error");use(normalize(resp.table),"LIVE // Statements loaded "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}))}catch(e){fallback(e.message)}};
function fallback(reason){try{const c=JSON.parse(localStorage.getItem(CACHE)||"{}");if(Object.keys(c).length){rows=c;status.textContent="CACHED / STALE // "+reason;render();return}}catch(_){};rows={};status.textContent="STATEMENT DATA UNAVAILABLE";render()}
function load(){status.textContent="Loading current statements…";const old=document.getElementById("statementQuery");if(old)old.remove();const n=Date.now(),tqx=encodeURIComponent(`responseHandler:__hubStatements;reqId:${n}`),s=document.createElement("script");s.id="statementQuery";s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=${tqx}&_=${n}`;s.onerror=()=>fallback("Network, permission, or Google Sheets query error.");document.body.appendChild(s);setTimeout(()=>{if(!Object.keys(rows).length)fallback("Statement request timed out.")},8000)}
john.onclick=()=>{selected="john";render()};prue.onclick=()=>{selected="prue";render()};document.getElementById("print").onclick=()=>window.print();document.getElementById("refresh").onclick=load;load();
})();
</script>
</body>
</html>

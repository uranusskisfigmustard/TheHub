name: Validate player page navigation

on:
  push:
    paths:
      - '*.html'
      - 'player-shell.js'
      - 'player-shell.css'
      - 'player-routes.js'
      - 'contacts.js'
      - 'contacts.css'
      - 'data/player-contacts.json'
      - 'data/shared-equipment.json'
      - 'pharmaceuticals.js'
      - 'tools/build-player-equipment.py'
      - 'tools/test_player_equipment.py'
      - 'assets/portraits/**'
      - 'tools/check-player-contacts.py'
      - 'tools/check-player-pages.py'
      - '.github/workflows/check-player-pages.yml'
  pull_request:
    paths:
      - '*.html'
      - 'player-shell.js'
      - 'player-shell.css'
      - 'player-routes.js'
      - 'contacts.js'
      - 'contacts.css'
      - 'data/player-contacts.json'
      - 'data/shared-equipment.json'
      - 'pharmaceuticals.js'
      - 'tools/build-player-equipment.py'
      - 'tools/test_player_equipment.py'
      - 'assets/portraits/**'
      - 'tools/check-player-contacts.py'
      - 'tools/check-player-pages.py'
      - '.github/workflows/check-player-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-page-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TheHub
        uses: actions/checkout@v4
      - name: Confirm all player pages have the Warden shortcut
        run: python3 tools/check-player-pages.py
      - name: Validate public notebook data and script
        run: |
          python3 tools/check-player-contacts.py
          node --check contacts.js


      - name: Validate player equipment exporter
        run: |
          python3 -m unittest discover -s tools -p test_player_equipment.py
          node --check pharmaceuticals.js

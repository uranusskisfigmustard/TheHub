name: Apply statements navigation

on:
  push:
    paths:
      - '.github/workflows/apply-statements-nav.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Statements navigation
        run: python scripts/add_statements_nav.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Add Statements navigation"
          git push

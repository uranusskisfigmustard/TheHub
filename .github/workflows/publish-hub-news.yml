name: Publish Hub News (Campaign Date)

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Confirmed campaign date (YYYY-DDD), e.g. 2237-283'
        required: true
        type: string
  repository_dispatch:
    types: [hub-campaign-date-advanced]

permissions:
  contents: write

concurrency:
  group: hub-news-campaign-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CAMPAIGN_DATE: ${{ github.event.inputs.as_of || github.event.client_payload.as_of }}
      HUB_NEWS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.HUB_NEWS_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out Hub player site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only Google Sheets client
        run: python -m pip install --disable-pip-version-check 'google-auth>=2,<3' 'requests>=2,<3'

      - name: Test private publication gate
        run: |
          python tools/test_build_hub_news.py
          python tools/test_publish_hub_news.py

      - name: Verify confirmed date and private credentials
        run: |
          if ! [[ "$CAMPAIGN_DATE" =~ ^[0-9]{4}-[0-9]{3}$ ]]; then
            echo 'A confirmed campaign date in YYYY-DDD format is required.' >&2
            exit 1
          fi
          if [ -z "$HUB_NEWS_GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Private Google Sheets credential not configured. No feed published.' >&2
            exit 1
          fi

      - name: Compile and validate sanitized public feed
        run: python tools/publish_hub_news.py --as-of "$CAMPAIGN_DATE"

      - name: Validate result before publishing
        run: |
          git diff --check -- data/hub-news.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/hub-news.json').read_text(encoding='utf-8'))
          assert p['schemaVersion'] == 1
          assert p['publicationMode'] == 'warden-curated'
          assert all(post.get('visibility') == 'PUBLIC' for post in p['posts'])
          print('Validated sanitized public News payload:', len(p['posts']), 'posts')
          PY

      - name: Publish only if public feed changed
        run: |
          if [ -z "$(git status --porcelain -- data/hub-news.json)" ]; then
            echo 'No new player-visible content.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/hub-news.json
          git commit -m "Publish Hub News through $CAMPAIGN_DATE"
          git push

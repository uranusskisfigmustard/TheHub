name: Sync player statements

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/sync-player-statements.yml'

permissions:
  contents: write

concurrency:
  group: player-statements-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch player-safe statement feed
        env:
          STATEMENTS_URL: https://script.google.com/macros/s/AKfycbzeW8vTooOCNEBia3_EMQ10r7BcbakXIwCD4ZaEOUEBOdCXl09tRHj76oxcUcsOKQK0/exec
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          callback = '__hubStatementSync'
          url = os.environ['STATEMENTS_URL'] + '?' + urllib.parse.urlencode({
              'action': 'statements',
              'callback': callback,
              'sync': 'github'
          })

          request = urllib.request.Request(url, headers={
              'User-Agent': 'TheHub-StatementSync/1.0'
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              text = response.read().decode('utf-8')

          match = re.fullmatch(r'\s*' + re.escape(callback) + r'\((.*)\);\s*', text, re.S)
          if not match:
              raise RuntimeError('Unexpected statement-feed response wrapper.')

          payload = json.loads(match.group(1))
          if payload.get('ok') is not True:
              raise RuntimeError(payload.get('error') or 'Statement feed returned ok=false.')

          allowed = {'john', 'prue'}
          statements = []
          for item in payload.get('statements') or []:
              key = str(item.get('key') or '').strip().lower()
              if key not in allowed:
                  continue
              statements.append({
                  'key': key,
                  'character': str(item.get('character') or ''),
                  'asOf': str(item.get('asOf') or ''),
                  'statementText': str(item.get('statementText') or '')
              })

          statements.sort(key=lambda item: item['key'])
          if not statements:
              raise RuntimeError('Statement feed returned no allowed player rows.')

          output = {
              'ok': True,
              'statements': statements,
              'count': len(statements)
          }

          path = Path('data/player-statements.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          rendered = json.dumps(output, ensure_ascii=False, indent=2) + '\n'
          if not path.exists() or path.read_text(encoding='utf-8') != rendered:
              path.write_text(rendered, encoding='utf-8')
              print('statement snapshot changed')
          else:
              print('statement snapshot unchanged')
          PY

      - name: Commit changed snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/player-statements.json)" ]; then
            echo 'No statement changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player-statements.json
          git commit -m 'Sync player statement snapshot'
          git push

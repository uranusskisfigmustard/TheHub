name: Remove retired audio from history
on:
  push:
    paths:
      - '.github/workflows/remove-retired-audio.yml'
permissions:
  contents: write
jobs:
  rewrite:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rewrite branch history and push with leases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo.git
          cd repo.git
          git for-each-ref --format='%(refname) %(objectname)' refs/heads/ > /tmp/old-heads
          test "$(git rev-parse refs/heads/main)" = "${GITHUB_SHA}"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --index-filter 'git rm -r --cached --ignore-unmatch -q -- warden-water "warden-audio*"' --prune-empty -- --branches
          if git rev-list --objects --branches | grep -Eq ' (warden-water/|warden-audio[^/]*)'; then
            echo "Filtered history still contains target files"; exit 1
          fi
          mapfile -t leases < <(awk '{print "--force-with-lease=" $1 ":" $2}' /tmp/old-heads)
          mapfile -t refs < <(awk '{print $1 ":" $1}' /tmp/old-heads)
          git push --atomic "${leases[@]}" origin "${refs[@]}"

name: Patch qualification review UI once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate qualification-review banner
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '        showAcceptanceResult("QUALIFICATION REVIEW\\n\\n" + (validation.message || "Employer authorization is required."), "warn");'
          new = '        hideAcceptanceResult();'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target line, found {count}.')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate qualification review banner"
          git push origin HEAD:main
<body><div id="boot">THE HUB // LOADING PUBLIC BOARD…</div>
<script>
(async()=>{
  const res=await fetch('board-layer-v1.html?v=20260826q4',{cache:'no-store'});
  if(!res.ok) throw new Error('Mission Board layer could not be loaded.');
  let source=await res.text();
  source=source.replaceAll('record?.','contractorRecord?.');
  const injection='\n  replace(/  let eligibility = \\{\\};[\\s\\S]*?  const REGULATED_CREDENTIALS = \\[[^\\n]*\\];/,`  let eligibility = {};\n  let eligibilitySnapshotValid = false;\n  try {\n    eligibility = JSON.parse(localStorage.getItem("mothership_hub_eligibility_v1") || "{}") || {};\n    eligibilitySnapshotValid = localStorage.getItem("mothership_hub_eligibility_live_v1") === "1";\n  } catch (_) {\n    eligibility = {};\n    eligibilitySnapshotValid = false;\n  }\n  const FALLBACK_CREW_SKILLS = new Set(["Military Training","Athletics","Hand-to-Hand Combat","Industrial Equipment","Jury-Rigging","Zero-G","Mechanical Repair"]);\n  const FALLBACK_CREW_CREDENTIALS = new Set(["Sponsor Pass","Interim Work Credentials"]);\n  const REGULATED_CREDENTIALS = ["Engineering Sign-Off Authority","Medical Responder Credential","Professional Psychological Assessment Credential","Explosives License","Armed Security Authorization","Weapons Custody Authorization","Field Hazard Firearms Authorization","Detention/Custody Authorization","Professional Pathology Credential","Medical Biohazard Response Credential","Professional Pharmacology Credential","Controlled-Substance Handling Authorization","Pilot License","Controlled AI Systems Authorization","Jump Navigation Authority","Hyperspace Sign-Off Authority","Surgical License"];`,\'live preflight state\');\n\n  replace(/  function useJobs\\(rows, source\\) \\{[\\s\\S]*?\\n  \\}/,`  function useJobs(rows, source) {\n    jobs = rows.sort((a,b) => Number(a["Sort Order"]||9999) - Number(b["Sort Order"]||9999));\n    jobsLoaded = true; jobsSource = source; configureFilters(); render();\n    refreshEligibility();\n  }`,\'live preflight jobs\');\n\n  replace(/  function setEligibility\\(jobId,state\\) \\{[\\s\\S]*?\\n  function decorateEligibility\\(\\) \\{/,`  function setEligibility(jobId,state) {\n    if (!jobId) return;\n    if (state) eligibility[jobId] = state; else delete eligibility[jobId];\n    try { localStorage.setItem("mothership_hub_eligibility_v1", JSON.stringify(eligibility)); } catch (_) {}\n  }\n\n  async function refreshEligibility() {\n    const jobIds = jobs.map(job => String(job["Job ID"] || "").trim()).filter(Boolean);\n    if (!jobIds.length) {\n      eligibility = {};\n      eligibilitySnapshotValid = true;\n      try {\n        localStorage.setItem("mothership_hub_eligibility_v1", "{}");\n        localStorage.setItem("mothership_hub_eligibility_live_v1", "1");\n      } catch (_) {}\n      decorateEligibility();\n      return;\n    }\n    try {\n      const response = await apiCall("preflight", {jobs: jobIds});\n      if (!response || response.ok === false || !response.states || typeof response.states !== "object") throw new Error("Qualification preflight unavailable.");\n      const next = {};\n      Object.entries(response.states).forEach(([jobId,state]) => {\n        const normalized = String(state || "").trim().toUpperCase();\n        if (normalized === "READY") next[jobId] = "ready";\n        if (normalized === "ACTION") next[jobId] = "action";\n      });\n      eligibility = next;\n      eligibilitySnapshotValid = true;\n      try {\n        localStorage.setItem("mothership_hub_eligibility_v1", JSON.stringify(eligibility));\n        localStorage.setItem("mothership_hub_eligibility_live_v1", "1");\n      } catch (_) {}\n      decorateEligibility();\n    } catch (_) {\n      decorateEligibility();\n    }\n  }\n\n  function inferCrewStatus(job) {\n    const id = String(job["Job ID"] || "").trim();\n    if (Object.prototype.hasOwnProperty.call(eligibility,id)) return eligibility[id];\n    if (eligibilitySnapshotValid) return "";\n    const q = qualificationParts(job["Qualification"]);\n    const preferred = splitSkills(job["Preferred Skills"]);\n    const required = splitSkills(job["Required Skills"]);\n    if (q.label === "OPEN") return "ready";\n    if (q.label === "PREFERRED") return preferred.some(s => FALLBACK_CREW_SKILLS.has(s)) ? "ready" : "action";\n    if (q.label === "REQUIRED") return required.length && required.every(s => FALLBACK_CREW_SKILLS.has(s)) ? "ready" : "";\n    if (q.label === "REGULATED") {\n      const named = REGULATED_CREDENTIALS.filter(c => String(job["Qualification"] || "").includes(c));\n      return required.length && required.every(s => FALLBACK_CREW_SKILLS.has(s)) && named.length && named.every(c => FALLBACK_CREW_CREDENTIALS.has(c)) ? "ready" : "";\n    }\n    return "";\n  }\n\n  function decorateEligibility() {`,\'live preflight logic\');\n\n  replace(/      const response = await apiCall\\("validate", \\{job:acceptanceJobId,participants:selectedAcceptanceCharacters\\(\\),pin:acceptPin.value,contractor:true,[\\s\\S]*?\\}\\);/,`      const response = await apiCall("validate", {\n        job: acceptanceJobId,\n        participants: selectedAcceptanceCharacters(),\n        pin: acceptPin.value,\n        contractor: true\n      });`,\'contractor transient validate\');\n\n  replace(/      const response = await apiCall\\("accept", \\{[\\s\\S]*?      \\}\\);/,`      const response = await apiCall("accept", {\n        job: acceptanceJobId,\n        participants: selectedAcceptanceCharacters(),\n        pin: acceptPin.value,\n        contractor: contractorConfirmed,\n        authorization: qualificationAuthorized\n      });`,\'contractor transient accept\');\n';
  source=source.replace('  document.open();',injection+'\n  document.open();');
  source=source.replace('  document.open();','  html=html.replace("</body>","<script src=\\\"terminal-acceptance.js?v=20260826t4\\\"><\\/script><script src=\\\"qualification-presentation.js?v=20260826qstate4\\\"><\\/script><script src=\\\"board-auth-session.js?v=20260826a3\\\"><\\/script><script src=\\\"player-shell-v1.js?v=20260828p2\\\"><\\/script><script src=\\\"player-board-v1.js?v=20260828p1\\\"><\\/script><script src=\\\"player-board-v2.js?v=20260828p2\\\"><\\/script></body>");\n  document.open();');
  source=source.replace('</footer>','<a href="warden.html" aria-label="Console" style="float:right;color:#777;opacity:.18;text-decoration:none;font-size:.62rem;line-height:1;padding:4px 2px;margin-top:4px">//</a></footer>');
  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  document.body.innerHTML='<div style="padding:28px;color:#c86655;font-family:monospace">MISSION BOARD LOAD ERROR<br><br>'+String(error.message||error)+'</div>';
});
</script>

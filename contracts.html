<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Hub — Contract Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player-shell.css?v=20260919-contractlogsprod1">
  <link rel="stylesheet" href="contract-logs.css?v=20260919-contractlogsprod1">
</head>
<body data-page="contract-logs">
  <div id="playerShell"></div>

  <main class="player-main contract-logs-mode">
    <section id="contractLogsPage" class="contract-logs-page" aria-label="Contract Logs">
      <div id="contractLogsRoot"></div>
    </section>
  </main>

  <noscript><div class="hub-shell-fatal">JavaScript is required for the player console.</div></noscript>

  <script src="player-routes.js?v=20260919-contractlogsprod1"></script>
  <script src="player-shell.js?v=20260919-contractlogsprod1"></script>
  <script src="contract-log-submissions.js?v=20260919-contractlogsprod1"></script>
  <script src="contract-logs.js?v=20260919-contractlogsprod1"></script>
  <script>
    (() => {
      const CONTRACTS_API = 'https://script.google.com/macros/s/AKfycbzeW8vTooOCNEBia3_EMQ10r7BcbakXIwCD4ZaEOUEBOdCXl09tRHj76oxcUcsOKQK0/exec';

      if (!window.HubContractLogsContent || typeof window.HubContractLogsContent.render !== 'function') {
        throw new Error('Contract Logs content module failed to load.');
      }

      const root = document.getElementById('contractLogsRoot');
      if (!root) throw new Error('Contract Logs root is unavailable.');

      window.HubContractLogsContent.render(root, {
        api: CONTRACTS_API,
        cacheKey: 'mothership_hub_contractfeed_v1',
        cacheTimeKey: 'mothership_hub_contractfeed_v1_time',
        sessionKey: 'mothership_hub_board_session_v1',
        sessionExpiryKey: 'mothership_hub_board_session_expiry_v1'
      });
    })();
  </script>
</body>
</html>

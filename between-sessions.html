<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Hub — Between Sessions</title>
  <link rel="stylesheet" href="player-shell.css?v=20260919-betweenprod1">
  <link rel="stylesheet" href="between-sessions.css?v=20260919-betweenprod2">
</head>
<body data-page="between-sessions">
  <div id="playerShell"></div>

  <main class="player-main between-sessions-mode">
    <section id="betweenSessionsPage" class="between-sessions-page" aria-labelledby="betweenSessionsTitle">
      <div class="between-sessions-heading">
        <h1 id="betweenSessionsTitle">Between Sessions</h1>
        <p class="between-sessions-sub">Scenes and developments occurring between completed missions.</p>
      </div>

      <div class="between-character-controls" aria-label="Character selection">
        <button class="between-character-btn active" type="button" data-between-character="prue" aria-pressed="true">PRUDENCE GREYMORE</button>
        <button class="between-character-btn" type="button" data-between-character="john" aria-pressed="false">JOHN SOBIESKI</button>
      </div>

      <div class="between-status">
        <span>CURRENT INTERSESSION RECORD</span>
        <span data-between-who>PRUDENCE GREYMORE</span>
      </div>

      <div class="intersession-layout">
        <aside class="period-selector" data-between-selector aria-label="Between-session period selection"></aside>
        <div class="reading-column" data-between-view></div>
        <div class="layout-spacer" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <noscript><div class="hub-shell-fatal">JavaScript is required for the player console.</div></noscript>
  <script src="player-routes.js?v=20260919-betweenprod1"></script>
  <script src="player-shell.js?v=20260919-betweenprod1"></script>
  <script src="between-sessions-data.js?v=20260919-betweenprod1"></script>
  <script src="between-sessions.js?v=20260919-betweenprod1"></script>
  <script>
    (() => {
      if (!window.HubBetweenSessionsContent || typeof window.HubBetweenSessionsContent.render !== 'function') {
        throw new Error('Between Sessions content module failed to load.');
      }
      const root = document.getElementById('betweenSessionsPage');
      if (!root) throw new Error('Between Sessions root is unavailable.');
      window.HubBetweenSessionsContent.render(root, window.BETWEEN_SESSION_PERIODS || {});
    })();
  </script>
</body>
</html>

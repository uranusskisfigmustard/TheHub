<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hub — Between Sessions</title>
<style>
:root{--bg:#111315;--panel:#191c1f;--panel2:#202428;--text:#e7e4dc;--muted:#aaa79f;--line:#3a3f43;--accent:#d4a84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;line-height:1.55}
header{position:sticky;top:0;z-index:5;background:rgba(17,19,21,.97);border-bottom:1px solid var(--line);padding:16px 18px 12px;backdrop-filter:blur(5px)}
.topline{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.2rem,4vw,1.8rem);letter-spacing:.08em;text-transform:uppercase}.sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.navrow,.controls{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.btn{font:inherit;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer;font-weight:800;letter-spacing:.08em;text-decoration:none}.btn:hover{border-color:var(--accent);color:var(--text)}.btn.active{color:var(--text);border-color:var(--accent);background:rgba(212,168,75,.10)}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 18px;color:var(--muted);font-size:.78rem;border-bottom:1px solid #25292c}
main{max-width:1280px;margin:0 auto;padding:18px}.intersession-layout{display:grid;grid-template-columns:210px minmax(0,960px) 210px;gap:24px;align-items:start}.period-selector{position:sticky;top:176px;min-width:0}.selector-label{margin:0 0 8px;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.selector-btn{display:block;width:100%;text-align:left;font:inherit;color:var(--muted);background:#171b1f;border:1px solid var(--line);border-radius:3px;padding:10px 11px;cursor:pointer}.selector-btn:hover{border-color:var(--accent);color:var(--text)}.selector-btn.active{border-color:var(--accent);background:rgba(212,168,75,.10);color:var(--text)}.selector-period{display:block;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.selector-dates{display:block;margin-top:3px;color:var(--muted);font-size:.68rem}.reading-column{grid-column:2;min-width:0}.layout-spacer{grid-column:3}.period{margin-bottom:28px}.period-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}.period-title{font-size:1rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.period-dates{color:var(--muted);font-size:.78rem}
.scene{background:linear-gradient(180deg,#171b1f 0%,#14181b 100%);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,.20)}.scene h2{margin:0 0 12px;font-size:1.06rem;letter-spacing:.06em;text-transform:uppercase}.scene p{margin:0 0 12px;color:#d8d4c8}.scene p:last-child{margin-bottom:0}.empty{padding:22px;border:1px dashed var(--line);color:var(--muted);background:var(--panel)}
@media(max-width:1100px){main{max-width:1000px}.intersession-layout{grid-template-columns:180px minmax(0,1fr);gap:18px}.layout-spacer{display:none}.reading-column{grid-column:2}}
@media(max-width:760px){main{padding:12px}.intersession-layout{display:block}.period-selector{position:static;margin:0 0 14px}.selector-label{margin-bottom:6px}.selector-btn{max-width:100%}.scene{padding:15px}.reading-column{width:100%}}
</style>
</head>
<body>
<header>
  <div class="topline"><div><h1>The Hub // Between Sessions</h1><div class="sub">Scenes and developments occurring between completed missions.</div></div></div>
  <nav class="navrow" aria-label="Hub navigation"><a class="btn" href="./">CONTRACTS</a><a class="btn" href="contracts.html">CONTRACT LOGS</a><a class="btn" href="./#classifieds">CLASSIFIEDS</a><a class="btn" href="statements.html">STATEMENTS</a><a class="btn active" href="between-sessions.html">BETWEEN SESSIONS</a></nav>
  <div class="controls" aria-label="Character selection"><button id="prue" class="btn active" type="button">PRUDENCE GREYMORE</button><button id="john" class="btn" type="button">JOHN SOBIESKI</button></div>
</header>
<div class="status"><span id="status">CURRENT INTERSESSION RECORD</span><span id="who">PRUDENCE GREYMORE</span></div>
<main>
  <div class="intersession-layout">
    <aside class="period-selector" aria-label="Between-session period selection">
      <div class="selector-label">INTERSESSION PERIODS</div>
      <button class="selector-btn active" type="button" aria-current="true" data-period="m2-m3">
        <span class="selector-period">M2 → M3</span>
        <span class="selector-dates">2237-241 → 2237-255</span>
      </button>
    </aside>
    <div id="view" class="reading-column"></div>
    <div class="layout-spacer" aria-hidden="true"></div>
  </div>
</main>
<script>
(()=>{
'use strict';
const DATA={
  prue:{name:'Prudence Greymore',interval:'M2 to M3',dates:'2237-241 to 2237-255',scenes:[
    {title:'Vera / Dr. Pella Sorn',paragraphs:[
      'You go back to Saint Orra to check on Vera. She is awake and the surgery is over. She is still surrounded by supports, medication lines, and enough monitoring equipment that getting out of bed is not her decision yet, but she is stable and very much alive.',
      'The first thing Vera asks is whether the final Claims account still says what actually happened. The equipment was overdue, the load data was wrong, the bypass had become normal, and people kept working anyway. She does not want the accident reduced to one worker touching the wrong thing. You tell her the Claims handoff did not do that. That matters to her.',
      'The employer is covering the treatment itself. Lost wages, rehabilitation, and whether Vera can return to the same work are less certain. Nobody is giving her a quick answer on those yet.',
      'Dr. Pella Sorn comes in during the visit to check Vera. When you ask about Quinn, Pella is willing to give you the broad facts: they survived, they are critically injured, and they are deeply sedated through most of the stabilization and reconstruction. She does not give you the details simply because you helped get Quinn here alive. Before she leaves, she tells you there may be a brief chance to see them later after a neurological assessment. “Brief means brief.”'
    ]},
    {title:'Quinn',paragraphs:[
      'Pella finds you later. Quinn’s sedation has been lightened for a neurological and response assessment, and the assessment is finished. They are awake enough to speak, but badly confused. Pella also warns you that the pain is significant even with medication. The point of the visit is not to get a decision out of Quinn, and anything they say while this disoriented would not be treated as consent for an irreversible procedure. If they become agitated or medically unstable, the visit ends.',
      'Quinn is surrounded by supports, lines, and equipment that make the bed look crowded around them. Their eyes find you after a few seconds and stay there. “Mom?”',
      'You tell them your name. Quinn nods like they understand, but a few sentences later they call you Mom again. They tell you it hurts. Not dramatically. Just directly, like they are trying to make sure somebody understands how much. They know the biological and orthopedic reconstruction is slower and more painful than the cybernetic route. They knew that when they chose it. Knowing it and living through it are turning out to be different things.',
      'Quinn tries to explain Bioconservatism the same way they have probably explained it to clinicians already. They do not think there is anything wrong with people who use cybernetics. Their eyes move toward your prosthetic when they say that. Their belief is about what they are willing to have done to their own body. They did not want fear, convenience, or a better prognosis to make that decision for them.',
      'Then another wave of pain hits and the explanation falls apart. Quinn seizes from pain, grips the sheet and waits until they can speak again. “I thought I could do this.” After a moment they add, “I thought saying no and meaning it was enough.”',
      'They know cybernetic reconstruction would be faster. They know the odds would probably be better. What they do not know anymore is whether refusing it is conviction or just stubbornness. Quinn asks if they are proving something to themselves, whether they chose the harder way because they were afraid of changing, and whether the pain is making them weak or finally making them honest.',
      '“I don’t know what I want.”',
      'For the first time, the question is not whether Saint Orra will respect the refusal. It will. The question is whether Quinn still wants to make it once they are lucid enough to decide again.',
      'Quinn looks at you and, for the moment, sees somebody else. “Mom, what am I supposed to do?”',
      'You do not make the decision for them. You remind them that nobody is going to make an irreversible choice from something they say while confused and in this much pain. Quinn seems to understand part of that. Maybe enough.',
      'Then the simpler fear comes out.',
      '“I don’t want to die.”',
      'There is no argument that fixes that. You stay. When Quinn calls you Mom again, you do not correct them a third time. A few minutes later the medication and exhaustion pull them back toward sleep, still without an answer.'
    ]},
    {title:'Kezi Moran',paragraphs:[
      'You reach out to Kezi deliberately. The last time you saw her, she was being delivered to medical care after Dead Air. That is not much of a basis for an ordinary relationship, so this time you are not contacting her because there is an emergency.',
      'Kezi is passing through Breakwater on a field call and agrees to meet while she waits on a parts release. She has a diagnostic unit open across her knees when you find her. “If this is a thank-you thing, I was unconscious for most of the impressive part.” It is not. You wanted to see how she was doing.',
      'She is back on field work, although the paperwork from Dead Air has not completely gone away. Emergency requisitions have to be justified, field modifications have to be documented, and several things that were necessary when people needed air look much less respectable afterward. Kezi sums it up as, “They love the word unauthorized after the air comes back on.”',
      'That gets the conversation onto repairs, bad conditions, and the difference between an unsafe shortcut and the only available way to keep a system working. It is easier for both of you than talking directly about nearly dying. You keep talking after the technical part has run out.'
    ]}
  ]},
  john:{name:'John Sobieski',interval:'M2 to M3',dates:'2237-241 to 2237-255',scenes:[
    {title:'Asha Raman / Captain Nizar Ilman',paragraphs:[
      'A few days after the loading-bay accident, you bring the Zero-G question back to Asha. You have the foundational book work behind you, but that is not the same thing as practical training. You ask who you need to know if you want to do the rest properly.',
      'Asha agrees to make an introduction, but she has a warning first. She respects your skills and your experience. Her concern is how you handle authority when you think the person giving the order is wrong. Nizar runs a ship. He expects people to notice problems and speak up, but somebody still has to have the final word when the ship and crew are his responsibility. Questioning an order is one thing. Deciding it does not apply to you is another.',
      '“I’m putting my name behind you, John. Don’t make me regret it.”',
      'The introduction happens later in a Breakwater service bay, well inside the area you are allowed to access. Captain Nizar Ilman is collecting equipment being returned to his salvage tender. Asha introduces you, Nizar points toward a hard case on the deck, and says, “Raman says you’re useful. Grab that end.”',
      'Most of the handoff is routine. The last item is a battered EVA maneuvering pack with old impact marks and a newer valve and manifold assembly underneath the casing. You ask about the damage. Nizar shows you the service tags and the pressure-test record. The housing looks bad, but it is not carrying pressure and the internal assembly was rebuilt and tested that morning. A cleaner-looking unit nearby has an unresolved valve problem and is the one he refused.',
      '“If you see something, say something. I want that. But once you’ve said it, listen to the answer.”',
      'That is the point Asha was trying to make. Nizar does not offer training, ship access, or anything else you are not currently cleared for. He does tell you to come by again when he is back through the service bays. It is not Zero-G training. It is a place to start.'
    ]},
    {title:'Opal Coil',paragraphs:[
      'About ten days after the accident, you find Opal in one of the labor offices off the freight concourse. She looks up from a table covered in incident reports and worker statements and asks, “What broke?” You tell her nothing did. You wanted to know what happened after the Claims handoff.',
      'That surprises her more than if you had asked for something. Undocumented bypasses are being prohibited instead of quietly tolerated. Questionable load data gets another verification. Overdue or high-risk equipment is easier to get onto a maintenance list, and stop-work protections are being improved. Management did not replace everything or add enough staff to eliminate every shortcut. As Opal puts it, “They fixed the things cheap enough to fix. The expensive problems are still being called complicated.”',
      'Workers are also talking to each other more. Opal is organizing around the accident, safety records, and who carries the risk when schedules get tight. There is no strike and no grand victory. There are simply more people asking the same questions at the same time.',
      'You stay after there is nothing left to report and ask about the injured workers and whether the new rules are actually being followed. Eventually Opal asks if you really came over just to see whether anything changed. When you confirm that you did, some of the suspicion goes out of her expression. “Next time you show up when you don’t need something, bring coffee.”'
    ]},
    {title:'Blythe Vale',paragraphs:[
      'Asha sends you through another routine Breakwater administrative check tied to your sponsored status. Nothing is wrong. The line is still slow. You end up sitting near a woman with a thick folder who keeps checking a handwritten list and the number board. One foot keeps bouncing against the floor. She asks an attendant twice whether she can refill her water without losing her place.',
      'When she comes back, she sits beside you, introduces herself as Blythe Vale, and starts talking. It comes out a little fast. She is another recovered resident, but her medical, recovery, and work-clearance records do not agree with each other. She has explained the problem enough times that she apologizes when she starts explaining it again.',
      'The line stalls when an attendant tries to send another recovered resident away for having the wrong version of a clearance form. Blythe gets up, points to the posted procedure, explains which desk issued the form, and keeps at it until the attendant checks instead of dismissing them. As soon as she sits back down, she looks embarrassed that everyone heard her.',
      'You keep talking until one of your numbers comes up. Blythe eventually admits what worries her: if somebody finally reconciles all of her records, the answer might not be that somebody made a mistake. It might be that there is nothing left in the system that can prove who she was.',
      'Nothing is promised between you. You are just two recovered people stuck in the same administrative system, and now you know each other. When your number comes up, Blythe calls after you, “If I see you in another one of these lines, I’m sitting next to you.”'
    ]}
  ]}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view=document.getElementById('view'),who=document.getElementById('who'),prue=document.getElementById('prue'),john=document.getElementById('john');let selected='prue';
function render(){const r=DATA[selected];prue.classList.toggle('active',selected==='prue');john.classList.toggle('active',selected==='john');who.textContent=r.name.toUpperCase();view.innerHTML=`<section class="period"><div class="period-head"><div class="period-title">${esc(r.name)} // ${esc(r.interval)}</div><div class="period-dates">${esc(r.dates)}</div></div>${r.scenes.map(scene=>`<article class="scene"><h2>${esc(scene.title)}</h2>${scene.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</article>`).join('')}</section>`}
prue.addEventListener('click',()=>{selected='prue';render()});john.addEventListener('click',()=>{selected='john';render()});render();
})();
</script>
<script src="player-shell-v1.js?v=20260828p2"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Hub — Purchase Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player-shell.css?v=20261014-warden-shortcut1">
  <link rel="stylesheet" href="purchases.css?v=20261021-pharmaceuticals2">
  <link rel="stylesheet" href="purchase-results.css?v=20260928-purchase-results1">
</head>
<body data-page="purchases">
  <div id="playerShell"></div>

  <main class="player-main purchases-mode">
    <section id="purchasesPage" class="purchases-page" aria-label="Purchase Board">
      <div id="purchaseRoot"></div>
    </section>
  </main>

  <noscript><div class="hub-shell-fatal">JavaScript is required for the player console.</div></noscript>

  <script src="player-routes.js?v=20261021-equipment3"></script>
  <script src="player-shell.js?v=20261014-warden-shortcut1"></script>
  <script src="pharmaceuticals.js?v=20261024-ledger-export1"></script>
  <script src="purchases.js?v=20261025-cassidy1"></script>
  <script>
    (() => {
      const PURCHASES_API = 'https://script.google.com/macros/s/AKfycbzeW8vTooOCNEBia3_EMQ10r7BcbakXIwCD4ZaEOUEBOdCXl09tRHj76oxcUcsOKQK0/exec';

      if (!window.HubPurchasesContent || typeof window.HubPurchasesContent.render !== 'function') {
        throw new Error('Purchase Board content module failed to load.');
      }

      const root = document.getElementById('purchaseRoot');
      if (!root) throw new Error('Purchase Board root is unavailable.');

      window.HubPurchasesContent.render(root, {
        api: PURCHASES_API,
        sessionKey: 'mothership_hub_board_session_v1',
        sessionExpiryKey: 'mothership_hub_board_session_expiry_v1'
      });
    })();
  </script>
  <script src="purchase-results.js?v=20260928-purchase-results2"></script>
</body>
</html>

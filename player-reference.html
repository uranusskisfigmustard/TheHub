<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Hub — Player Reference</title>
  <link rel="stylesheet" href="player-shell.css?v=20260919-refprod1">
  <link rel="stylesheet" href="player-reference.css?v=20260919-refprod1">
</head>
<body data-page="reference">
  <div id="playerShell"></div>

  <main class="player-main reference-mode">
    <section id="playerReferencePage" class="player-reference-page">
      <div class="player-reference-heading">
        <h1>Player Reference</h1>
        <p class="player-reference-sub">Current campaign rules, work procedures, housing, finances, and available cybernetics.</p>
      </div>
      <p class="reference-intro">Use this page as the quick reference for established player-facing campaign rules.</p>
      <div id="referenceRoot"></div>
      <div class="reference-footnote">Only currently relevant player-facing systems are shown.</div>
    </section>
  </main>

  <noscript><div class="hub-shell-fatal">JavaScript is required for the player console.</div></noscript>
  <script src="player-routes.js?v=20260919-refprod1"></script>
  <script src="player-shell.js?v=20260919-refprod1"></script>
  <script src="player-reference.js?v=20260919-refprod1"></script>
  <script>
    (() => {
      if (!window.HubPlayerReferenceContent || typeof window.HubPlayerReferenceContent.render !== 'function') {
        throw new Error('Player Reference content module failed to load.');
      }
      const root = document.getElementById('referenceRoot');
      if (!root) throw new Error('Player Reference root is unavailable.');
      window.HubPlayerReferenceContent.render(root);
    })();
  </script>
</body>
</html>
